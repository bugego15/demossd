# SSD firmware simulator configuration
# Geometry: 4CH x 4die x 64blk x 512pg x 16KB = 8 GB raw
channels = 4
dies = 4
blocks = 64
pages_per_block = 512
page_size = 16384
sector_size = 512
op_ratio = 0.07
meta_blocks = 8
bad_block_pct = 0.0

# NAND timing
tprog_ns = 800000
tr_ns = 70000
tbers_ns = 3000000
bus_mts = 1200
cmd_ns = 1000

# FTL / cache / scheduler
cache_pages = 256
cache_flush_pct = 50
cache_lat_ns = 5000
queue_depth = 32
flush_out_max = 128
gc_trigger_pct = 5
gc_victim_max_pct = 50
gc_max_out = 8
wl_threshold = 30
endurance = 3000
ecc_rate = 0.0

# power-loss protection
plp = 1
plp_budget_ns = 50000000
ckpt_interval = 65536
jnl_flush_at = 1024
reserve_blocks = 4
power_cuts = 0
cut_interval_ns = 20000000000

# workload
workload = rand
fill = 1
fill_pct = 70
n_ios = 300000
io_sectors = 32
read_ratio = 0.5
zipf_s = 0.99
verify = 1
seed = 42
verbose = 0
